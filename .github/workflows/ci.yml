name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo insta test --unreferenced reject

  python:
    name: Runtime pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pandas pyarrow
      - run: python -m pytest

  wheel:
    name: Wheel build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - run: maturin build --release --out dist
      - run: pip install dist/*.whl
      - name: Smoke-test binary and runtime from the wheel
        run: |
          riv --version
          python -m riv --version
          python -c "import riv; riv.riv_in; riv.riv_out; riv.Schema; riv.Untyped"
          cd examples/hello && riv check
